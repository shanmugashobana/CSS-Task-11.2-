<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Development Form</title>
    <link rel="stylesheet" href="./stye.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer"> 
    <link href="https://fonts.googleapis.com/css2?family=Nunito&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">

        <div class="form">
           <h1>Web Development Workshop</h1>
            <p>Number of available seats 23</p>

             <div class="left-side">
                <img src="./workshop.webp" alt="Workshop">

              </div>
                     

            <div class="right-side">
                <div class="input-box">
                    <i class="fa-jelly fa-regular fa-user"></i>
                    <span class="star">*</span>
                    <input type="text" placeholder="Username">
                    
                </div>
                <div class="input-box">
               <i class="fa-solid fa-envelope-open"></i>
               <span class="star">*</span>
                <input type="email" placeholder="Email">
                
                </div>

                <div class="input-box">
                <i class="fa-solid fa-square-phone"></i>
                <span class="star">*</span>
                <input type="tel" placeholder="Phone No">
                
                </div>

                <div class="input-box">
                <i class="fa-solid fa-chair"></i> 
                <input type="number"placeholder="Choose no of seats">
                </div>

                <div class="input-box">
                <i class="fa-solid fa-circle-user"></i>
                <input type="text" placeholder="Second Username">
                </div>

                <div class="buttons">             
                    <button class="submit-btn">Submit</button>
                    <button class="cancel-btn">Cancel</button>
                </div>

            </div>


       </div>   
     
    </div>
    
    
    
</body>
</html>
